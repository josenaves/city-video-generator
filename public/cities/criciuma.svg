<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2F4F4F;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#2F4F4F40;stop-opacity:0.5" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)" />
  
  <!-- Decorative elements -->
  <circle cx="100" cy="80" r="60" fill="#2F4F4F" opacity="0.2" />
  <circle cx="700" cy="520" r="90" fill="#2F4F4F" opacity="0.15" />
  <circle cx="650" cy="120" r="50" fill="#2F4F4F" opacity="0.25" />
  
  <!-- State Badge -->
  <rect x="300" y="70" width="200" height="55" rx="8" fill="#2F4F4F" opacity="0.95" />
  <text x="400" y="108" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">SC</text>
  
  <!-- City Name -->
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3)">
    Criciúma
  </text>
  
  <!-- Map pin -->
  <path d="M400,340 C370,340 350,370 350,400 C350,440 400,480 400,480 C400,480 450,440 450,400 C450,370 430,340 400,340 Z" fill="#2F4F4F" opacity="0.9" />
  <circle cx="400" cy="400" r="22" fill="white" opacity="0.95" />
  
  <!-- Rich indicator -->
  <text x="400" y="510" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" opacity="0.8">
    Uma das cidades mais ricas de SC
  </text>
  
  <!-- Footer -->
  <rect x="250" y="540" width="300" height="3" fill="#2F4F4F" opacity="0.5" />
</svg>